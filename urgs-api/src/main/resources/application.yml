server:
  port: 8080
  
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/urgs_dev?useSSL=false&serverTimezone=%2B08:00&characterEncoding=utf8&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:a8548879}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  neo4j:
    uri: ${SPRING_NEO4J_URI:bolt://127.0.0.1:7687}
    authentication:
      username: ${SPRING_NEO4J_AUTHENTICATION_USERNAME:neo4j}
      password: ${SPRING_NEO4J_AUTHENTICATION_PASSWORD:12345678}
  servlet:
    multipart:
      max-file-size: 2048MB
      max-request-size: 2048MB
  flyway:
    out-of-order: true
    ignore-migration-patterns: "*:ignored"

ai:
  rag:
    base-url: "${RAG_BASE_URL:http://localhost:8001/api/rag}"
    doc-store-path: "${RAG_DOC_STORE_PATH:${user.dir}/data/rag/doc_store}"

lineage:
  engine:
    workdir: "${LINEAGE_ENGINE_WORKDIR:${user.dir}/../sql-lineage-engine}"
    shared-dir: "${LINEAGE_ENGINE_SHARED_DIR:${user.dir}/data/lineage/share}"
    script: "./run.sh"

deploy:
  tool:
    workdir: "${DEPLOY_TOOL_WORKDIR:${user.dir}/data/db_deploy}"

executor:
  base-url: "${EXECUTOR_BASE_URL:http://127.0.0.1:8082}"
  stats-connect-timeout-ms: "${EXECUTOR_STATS_CONNECT_TIMEOUT_MS:2000}"
  stats-read-timeout-ms: "${EXECUTOR_STATS_READ_TIMEOUT_MS:3000}"

urgs:
  profile: "${URGS_PROFILE:${user.dir}/data/api/uploads}"
  api-base-url: "${URGS_API_BASE_URL:}"
  web-base-url: "${URGS_WEB_BASE_URL:}"
  onlyoffice:
    document-server-url: "${ONLYOFFICE_DOCUMENT_SERVER_URL:http://localhost:8088}"
    callback-secret: "${ONLYOFFICE_CALLBACK_SECRET:urgs-onlyoffice-callback-secret}"
    jwt-secret: "${ONLYOFFICE_JWT_SECRET:}"
  internal-api:
    auth-header: "${URGS_INTERNAL_API_AUTH_HEADER:Authorization}"
    auth-prefix: "${URGS_INTERNAL_API_AUTH_PREFIX:Bearer }"
    auth-token: "${URGS_INTERNAL_API_TOKEN:}"
  inbound-sso:
    rsa:
      private-key: "${URGS_INBOUND_SSO_RSA_PRIVATE_KEY:}"

im:
  upload:
    path: "${IM_UPLOAD_PATH:${user.dir}/data/api/im-uploads}"

issue:
  attachment:
    path: "${ISSUE_ATTACHMENT_PATH:${user.dir}/data/attachments}"
