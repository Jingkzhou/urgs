server:
  port: 8080
  
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/urgs_dev?useSSL=false&serverTimezone=%2B08:00&characterEncoding=utf8&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:a8548879}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  neo4j:
    uri: ${SPRING_NEO4J_URI:bolt://127.0.0.1:7687}
    authentication:
      username: ${SPRING_NEO4J_AUTHENTICATION_USERNAME:neo4j}
      password: ${SPRING_NEO4J_AUTHENTICATION_PASSWORD:12345678}
  servlet:
    multipart:
      max-file-size: 2048MB
      max-request-size: 2048MB
  flyway:
    out-of-order: true
    ignore-migration-patterns: "*:ignored"

ai:
  rag:
    base-url: "${RAG_BASE_URL:http://localhost:8001/api/rag}"
    doc-store-path: "${RAG_DOC_STORE_PATH:${user.dir}/data/rag/doc_store}"

lineage:
  engine:
    workdir: "${LINEAGE_ENGINE_WORKDIR:${user.dir}/../sql-lineage-engine}"
    shared-dir: "${LINEAGE_ENGINE_SHARED_DIR:${user.dir}/data/lineage/share}"
    script: "./run.sh"

deploy:
  tool:
    workdir: "${DEPLOY_TOOL_WORKDIR:${user.dir}/data/db_deploy}"

executor:
  base-url: "${EXECUTOR_BASE_URL:http://127.0.0.1:8082}"

