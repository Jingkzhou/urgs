spring.application.name=urgs-executor
server.port=${URGS_EXECUTOR_PORT:8082}
task.api-auth-header=${URGS_INTERNAL_API_AUTH_HEADER:Authorization}
task.api-auth-prefix=${URGS_INTERNAL_API_AUTH_PREFIX:Bearer }
task.api-auth-token=${URGS_INTERNAL_API_TOKEN:}

spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.url=${URGS_EXECUTOR_DB_URL:jdbc:mysql://127.0.0.1:3306/urgs_dev?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=%2B08:00}
spring.datasource.username=${URGS_EXECUTOR_DB_USERNAME:root}
spring.datasource.password=${URGS_EXECUTOR_DB_PASSWORD:a8548879}
spring.datasource.driver-class-name=${URGS_EXECUTOR_DB_DRIVER:com.mysql.cj.jdbc.Driver}

mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

logging.level.com.example.executor.quartz=INFO

task.executor.pool-size=${TASK_EXECUTOR_POOL_SIZE:500}
task.executor.queue-capacity=${TASK_EXECUTOR_QUEUE_CAPACITY:10000}

sendmessage.shortmsgNewIp=${SENDMESSAGE_SHORTMSGNEWIP:25.18.17.139}
sendmessage.shortmsgNewPort=${SENDMESSAGE_SHORTMSGNEWPORT:11000}
sendmessage.shortmsgNewAction=${SENDMESSAGE_SHORTMSGNEWACTION:rbsp}
sendmessage.shortmsgNewSystemid=${SENDMESSAGE_SHORTMSGNEWSYSTEMID:RBSP}
