[package]
name = "urgs-desktop"
version = "0.1.12"
description = "监管报送一体化系统 Windows 客户端"
authors = ["URGS Team"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "urgs_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["process", "sync", "time"] }
toml = "0.8"
portable-pty = "0.9.0"
url = "2.5"
uuid = { version = "1", features = ["v4"] }
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "linux-native"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
