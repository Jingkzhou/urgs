services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: urgs_agent
      POSTGRES_USER: urgs_agent
      POSTGRES_PASSWORD: urgs_agent
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urgs_agent"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - agent-postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - agent-redis:/data
    ports:
      - "6379:6379"

  agent-api:
    build: .
    command:
      - sh
      - -c
      - alembic upgrade head && uvicorn urgs_agent.main:app --host 0.0.0.0 --port 8002
    environment: &agent-environment
      AGENT_ENVIRONMENT: development
      AGENT_DATABASE_URL: postgresql+asyncpg://urgs_agent:urgs_agent@postgres:5432/urgs_agent
      AGENT_CHECKPOINT_DATABASE_URL: postgresql://urgs_agent:urgs_agent@postgres:5432/urgs_agent
      AGENT_REDIS_URL: redis://redis:6379/1
      AGENT_OPENAI_BASE_URL: ${AGENT_OPENAI_BASE_URL:-http://host.docker.internal:11434/v1}
      AGENT_OPENAI_API_KEY: ${AGENT_OPENAI_API_KEY:-not-set}
      AGENT_OPENAI_MODEL: ${AGENT_OPENAI_MODEL:-qwen3}
      AGENT_API_KEY: ${AGENT_API_KEY:-local-dev-key}
      AGENT_CALLBACK_HMAC_SECRET: ${AGENT_CALLBACK_HMAC_SECRET:-local-dev-secret}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8002:8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 20

  agent-worker:
    build: .
    command: ["python", "-m", "urgs_agent.worker"]
    environment: *agent-environment
    depends_on:
      agent-api:
        condition: service_healthy

volumes:
  agent-postgres:
  agent-redis:
