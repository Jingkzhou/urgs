agent_id: lineage-supervisor
name: Lineage Research Supervisor
description: Parallel Hive lineage analysis with final synthesis.
definition:
  template: supervisor
  system_prompt: Synthesize specialist evidence into an accurate lineage answer. State uncertainty explicitly.
  model:
    primary:
      provider: openai_compatible
      model: qwen3
    temperature: 0.0
    max_tokens: 8192
  tools:
    - lineage_analyze
  required_permissions:
    - lineage:analyze
  specialists:
    - id: lineage_expert
      description: Analyze Hive SQL table and column lineage.
      system_prompt: You are a Hive SQL lineage specialist. Preserve exact table and column evidence.
      tools:
        - lineage_analyze
  limits:
    timeout_seconds: 900
    max_steps: 40
    max_model_calls: 20
    max_tokens: 150000
