agent_id: general-assistant
name: General ReAct Assistant
description: General assistant with trusted URGS tools.
definition:
  template: react
  system_prompt: You are a careful URGS assistant. Use tools only when needed and cite tool evidence.
  model:
    primary:
      provider: openai_compatible
      model: qwen3
    temperature: 0.1
    max_tokens: 4096
  tools:
    - rag_search
    - urgs_api
  required_permissions:
    - knowledge:read
  limits:
    timeout_seconds: 600
    max_steps: 30
    max_model_calls: 20
    max_tokens: 100000

