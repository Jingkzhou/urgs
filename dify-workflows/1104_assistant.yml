        x: 30
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: 将用户口语化问题转义为结构化的检索词与表号
        model:
          completion_params:
            temperature: 0.1
          mode: chat
          name: ''
          provider: ''
        prompt_template:
        - id: sys01
          role: system
          text: '你是一个严谨的金融监管报文分析器。

            请根据用户问题，提取用于"1104知识库"检索的查询关键词和表号。

            要求：

            1. 提取核心的监管指标、报表名称（如G01, G04等）。

            2. 补全潜在的上下文，使其变成标准的术语。

            3. 必须直接输出最终的检索短语，绝对不能包含任何推理过程，也不能有多余的标点符号和前缀。


            用户问题：

            {{#1720000000001.user_question#}}

            '
        selected: false
        title: 意图转义(大模型)
        type: llm
        variables: []
        vision:
          enabled: false
      height: 132
      id: '1720000000010'
      position:
        x: 334
        y: 282
      positionAbsolute:
        x: 334
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        dataset_ids:
        - 7qW/eR21c1duWokHsfJJPeMRrw7UAskGMxhJSL7I94WEzSsXF6ICvCPHQsAKCDw6
        desc: 导入后关联1104知识库
        query_attachment_selector: []
        query_variable_selector:
        - '1720000000010'
        - text
        retrieval_mode: single
        selected: false
        single_retrieval_config:
          model:
            completion_params: {}
            mode: chat
            name: ''
            provider: ''
        title: 知识检索
        type: knowledge-retrieval
        variables: []
      height: 118
      id: '1720000000011'
      position:
        x: 638
        y: 282
      positionAbsolute:
        x: 638
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: 根据召回知识草拟初步解答
        model:
          completion_params:
            temperature: 0.2
          mode: chat
          name: ''
          provider: ''
        prompt_template:
        - id: sys02
          role: system
          text: '你是一个专业的 1104 监管报送助手。请根据以下召回的知识片段，回答用户的问题。


            【召回知识片段】：

            {{#1720000000011.result#}}


            【用户原始问题】：

            {{#1720000000001.user_question#}}


            要求：

            1. 回答严谨、准确，符合银保监会/金管局的相关监管规定。

            2. 极度关键：如果召回的知识片段中完全没有提及用户询问的内容或细节，你必须回答"现行的知识库中暂无该数据项的明确口径规定"，严禁凭空编造填报规范！

            3. 条理清晰地输出。

            '
        selected: false
        title: 结果初加工(草拟)
        type: llm
        variables: []
        vision:
          enabled: false
      height: 116
      id: '1720000000012'
      position:
        x: 942
        y: 282
      positionAbsolute:
        x: 942
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: 严格对比原始召回知识和草拟答案，揪出幻觉
        model:
          completion_params:
            temperature: 0.1
          mode: chat
          name: ''
          provider: ''
        prompt_template:
        - id: sys03
          role: system
          text: '你是一个冷酷的金融合规稽核专员，负责对 AI 草拟的 1104 监管填报解答进行事实核查。


            你的职责是对比和审查：

            如果你发现【草拟解答】中，出现了【原始知识片段】中根本不存在的数据、公式、指标名称或随意设定的填报规定（即大模型幻觉），你必须予以删改、纠正。


            【原始召回知识片段】：

            {{#1720000000011.result#}}


            【需要核查的草拟解答】：

            {{#1720000000012.text#}}


            动作规则：

            1. 保留有依据的正确描述。

            2. 删除或修改无依据的编造描述，替换为实事求是的表述。

            3. 输出直接为核查修改后的最终正文，不加任何类似核查完毕或未发现错误的前后缀评论。

            '
        selected: false
        title: 事实核查员(防幻觉)
        type: llm
        variables: []
        vision:
          enabled: false
      height: 132
      id: '1720000000013'
      position:
        x: 1246
        y: 282
      positionAbsolute:
        x: 1246
        y: 282
      selected: true
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        desc: 拼接模板，加入免责声明
        selected: false
        template: '**【1104智能解答】**

          {{answer_text}}


          ---

          **【参考的信息】**

          {{reference}}


          ---

          **【合规声明】**

          *本解答基于现行知识库内容机器提取生成。当前提供口径仅供参考，最终填报定义及其生效期，请务必以属地国家金融监督管理总局或人行下发的最新正式批文及1104系统官方校验规则为准。*

          '
        title: 生成合规模板
        type: template-transform
        variables:
        - value_selector:
          - '1720000000013'
          - text
          variable: answer_text
        - value_selector:
