app:
  description: '【进阶加固版】通用监管填报说明 ETL 全流程向量化工作流。包含：文档长窗解析、LLM 逻辑及元数据提取、正则非贪婪 JSON 脱水清洗、脏数据条件拦截(If/Else) 及挂载自定义 Metadata 的自动化 API 入库。'
  icon: "�️"
  icon_background: '#E1E9FF'
  mode: workflow
  name: 通用监管文档 ETL (稳定进阶版)
workflow:
  features:
    file_upload:
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        sourceType: start
        targetType: document-extractor
      id: 1720000000001-source-1720000000002-target
      source: '1720000000001'
      sourceHandle: source
      target: '1720000000002'
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: document-extractor
        targetType: llm
      id: 1720000000002-source-1720000000003-target
      source: '1720000000002'
      sourceHandle: source
      target: '1720000000003'
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: llm
        targetType: code
      id: 1720000000003-source-1720000000004-target
      source: '1720000000003'
      sourceHandle: source
      target: '1720000000004'
      targetHandle: target
      type: custom
      zIndex: 0
    
    # 将原来的 Code -> HTTP 改为 Code -> IfElse
    - data:
        isInIteration: false
        sourceType: code
        targetType: if-else
      id: 1720000000004-source-1720000000007-target
      source: '1720000000004'
      sourceHandle: source
      target: '1720000000007'
      targetHandle: target
      type: custom
      zIndex: 0
      
    # IF 条件成立 (True) -> HTTP 请求 (走正常入库)
    - data:
        isInIteration: false
        sourceType: if-else
        targetType: http-request
      id: 1720000000007-true-1720000000005-target
      source: '1720000000007'
      sourceHandle: 'true'
      target: '1720000000005'
      targetHandle: target
      type: custom
      zIndex: 0

    # IF 条件不成立 (False) -> End (异常记录分支拦截)
    - data:
        isInIteration: false
        sourceType: if-else
        targetType: end
      id: 1720000000007-false-1720000000008-target
      source: '1720000000007'
      sourceHandle: 'false'
      target: '1720000000008'
      targetHandle: target
      type: custom
      zIndex: 0

    # HTTP 请求完成 -> End (正常分支结束)
    - data:
        isInIteration: false
        sourceType: http-request
        targetType: end
      id: 1720000000005-source-1720000000006-target
      source: '1720000000005'
      sourceHandle: source
      target: '1720000000006'
      targetHandle: target
      type: custom
      zIndex: 0

    nodes:
    - data:
        desc: ''
        selected: false
        title: Start
        type: start
        variables:
        - label: 文档
          max_length: 0
          options: []
          required: true
          type: file
          allowed_file_types:
          - document
          allowed_file_extensions:
          - .pdf
          - .docx
          - .doc
          - .txt
          - .csv
          allowed_file_upload_methods:
          - local_file
          - remote_url
          variable: source_document
        - label: 目标知识库ID
          max_length: 48
          options: []
          required: true
          type: text-input
          variable: dataset_id
        - label: 知识库 API Key
          max_length: 100
          options: []
          required: true
          type: text-input
          variable: dataset_api_key
      height: 90
      id: '1720000000001'
      position:
        x: 0
        y: 200
      positionAbsolute:
        x: 0
        y: 200
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: '解析上传且可能非常长的文档为纯文本'
        selected: false
        title: 文档提取
        type: document-extractor
        variable_selector:
        - '1720000000001'
        - source_document
      height: 90
      id: '1720000000002'
      position:
        x: 300
        y: 200
      positionAbsolute:
        x: 300
        y: 200
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
      
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: '提取公式及Metadata。建议搭配 1M/2M 等大上下文模型。'
        model:
          completion_params:
            temperature: 0.05
          mode: chat
          name: ''
          provider: ''
        prompt_template:
        - id: sys1
          role: system
          text: '你是一个金融监管极长文档及规范解析专家。请阅读以下文件文本，一并提取以下元数据和内容：1) 报表或规范的系统编码（如G01，若无或找不到则设为"通用"）。2) 报表或规范的完整主名称。3) 该文档所属的大分类类型 (如"填报说明"、"通知指引"、"核查规则")。4) 所有的“核对公式”或“表间核对关系”（如果存在）。5) 填报口径说明、规则要求或操作指南。6) 全局摘要。\n\n请严格输出一个 JSON 对象，字段必须且仅包含：report_code (字符串), report_name (字符串), doc_type (字符串), formulas (数组，包含 rule_id, formula, description), explanations (口径/规则数组，字符串), summary (摘要字符串)。\n重要：直接返回纯净的 `{...}` 格式的 JSON，绝对不要输出任何 markdown 格式标记（不允许使用 ```json）、也没有任何寒暄或头尾文字。\n\n【文档内容】\n{{#1720000000002.text#}}'
        selected: false
        title: LLM (无损信息提取)
        type: llm
        variables: []
        vision:
          enabled: false
      height: 98
      id: '1720000000003'
      position:
        x: 600
        y: 200
      positionAbsolute:
        x: 600
        y: 200
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
      
    - data:
        code: |
          import json
          import re
          
          def main(llm_output: str) -> dict:
              try:
                  # 使用正则表达式提取最外层的 JSON 结构，(?s) 代表 re.DOTALL 使得 . 可以匹配换行符
                  # 寻找第一个 { 开头，到最后一个 } 结尾的所有内容
                  match = re.search(r'(?s)\{.*\}', llm_output)
                  if not match:
                      raise ValueError("LLM 未能输出包裹在 {} 内的 JSON")
                      
                  json_str = match.group(0)
                  # 尝试解析提取出来的 JSON 字符串
                  data = json.loads(json_str)
                  
                  # 提取强化的 Custom Metadata
                  doc_type = data.get('doc_type', '通用规制类型')
                  report_code = data.get('report_code', '通用编码')
                  report_name = data.get('report_name', '通用名称')
                  
                  # 放弃从上传文件拿字面，直接用 LLM 完美提取出来的名称构建规范名
                  doc_title = f"[{report_code}] {report_name}"
                  
                  # 组装长文本部分
                  combined_text = f"【文档摘要】\n{data.get('summary', '')}\n\n【规则与公式】\n"
                  for f in data.get('formulas', []):
                      combined_text += f"{f.get('rule_id', '')}: {f.get('formula', '')} - {f.get('description', '')}\n"
                  
                  combined_text += "\n【口径与说明】\n"
                  for e in data.get('explanations', []):
                      combined_text += f"- {e}\n"
                  
                  # 深度利用 API：应用父子分块（Hierarchical 切片）
                  # 这是针对长篇复杂监管说明（存在长篇总则包含极短公式子元素）的最佳推荐模式
                  payload = {
                     "name": doc_title,
                     "text": combined_text,
                     "indexing_technique": "high_quality",
                     "doc_metadata": {
                         "doc_type": doc_type,
                         "report_code": report_code,
                         "source": "automated_etl_pipeline"
                     },
                     "process_rule": {
                         # 必须指定为 hierarchical 模式开启高级父子切片规则
                         "mode": "hierarchical",
                         "rules": {
                             "pre_processing_rules": [{"id": "remove_extra_spaces", "enabled": True}],
                             # 父分块限制
                             "parent_classes": ["paragraph"],
                             "segmentation": {
                                 "separator": "\n\n",
                                 "max_tokens": 800, # 父切片长度
                                 "chunk_overlap": 100
                             },
                             # 子分块特征（公式、规则级等细粒度子文档）
                             "subchunk_segmentation": {
                                 "separator": "\n",
                                 "max_tokens": 150, # 子切片长度
                                 "chunk_overlap": 20
                             }
                         }
                     }
                  }
                  
                  # 设置 status = success 让后置的 If/Else 放行！
                  return {"payload_json": json.dumps(payload, ensure_ascii=False), "status": "success", "error_log": ""}
              except Exception as e:
                  # 如果 JSON 解析等报错，直接设置 status = error 触发分支阻断
                  return {"payload_json": "{}", "status": "error", "error_log": str(e) + " | 源产出: " + llm_output}
        code_language: python3
        desc: '正则脱水、注入Metadata、并输出 status 用于异常拦截'
        outputs:
          payload_json:
            type: string
          status:
            type: string
          error_log:
            type: string
        title: Code (组装 API 与防脏拦截)
        type: code
        variables:
        - value_selector:
          - '1720000000003'
          - text
          variable: llm_output
      height: 90
      id: '1720000000004'
      position:
        x: 900
        y: 200
      positionAbsolute:
        x: 900
        y: 200
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
      
    - data:
        cases:
        - case_id: 'true'
          conditions:
          - comparison_operator: contains
            id: cond_success
            value: 'success'
            varType: string
            variable_selector:
            - '1720000000004'
            - status
          id: 'true'
          logical_operator: and
        desc: '若状态不是 success，阻断后续流程并跳到报错结束页，防止脏数据入库'
        selected: false
        title: 拦截脏数据探测
        type: if-else
      height: 95
      id: '1720000000007'
      position:
        x: 1200
        y: 200
      positionAbsolute:
        x: 1200
        y: 200
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244

    # HTTP节点：仅在 If 出口为 True 时执行
    - data:
        authorization:
          config: null
          type: no-auth
        body:
          data: '{{#1720000000004.payload_json#}}'
          type: raw-text
        desc: '调用 Dify 内部知识库新增文档 API'
        headers: "Authorization: Bearer {{#1720000000001.dataset_api_key#}}\nContent-Type: application/json"
        method: post
        params: ''
        selected: false
        timeout:
          connect: 15
          read: 60
          write: 20
        title: HTTP Request (安全入库)
        type: http-request
        url: 'http://25.18.92.167/v1/datasets/{{#1720000000001.dataset_id#}}/document/create-by-text'
      height: 90
      id: '1720000000005'
      position:
        x: 1515
        y: 54
      positionAbsolute:
        x: 1515
        y: 54
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
      
    # 正常结束口 (挂载于 HTTP Request 之后)
    - data:
        desc: '成功入库'
        outputs:
        - value_selector:
          - '1720000000004'
          - status
          variable: final_status
        - value_selector:
          - '1720000000005'
          - body
          variable: api_response
        selected: false
        title: 入库成功
        type: end
      height: 90
      id: '1720000000006'
      position:
        x: 1815
        y: 54
      positionAbsolute:
        x: 1815
        y: 54
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
      
    # 异常错误抛出口 (挂载于 If/Else 的 False 或 Else 处理)
    - data:
        desc: '脏数据或格式错误被阻断抛弃，中止流程'
        outputs:
        - value_selector:
          - '1720000000004'
          - status
          variable: final_status
        - value_selector:
          - '1720000000004'
          - error_log
          variable: error_log
        selected: false
        title: 拦截与报错
        type: end
      height: 90
      id: '1720000000008'
      position:
        x: 1515
        y: 346
      positionAbsolute:
        x: 1515
        y: 346
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    viewport:
      x: 0
      y: 0
      zoom: 1
