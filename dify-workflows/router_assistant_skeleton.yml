app:
  description: 全局意图网关与路由分发（带自动反问机制）
  icon: 🚦
  icon_background: '#F5F8FA'
  mode: advanced-chat
  name: 智能总线Router
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.1.5
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: false
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: '你好，我是智能总管。请问有什么可以帮您？（例如：你可以问我1104填报、监管政策，或者和我日常聊天）'
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        sourceType: start
        targetType: llm
      id: start-to-intent_llm
      source: 'start'
      sourceHandle: source
      target: 'intent_llm'
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: llm
        targetType: code
      id: intent_llm-to-json_parser
      source: 'intent_llm'
      sourceHandle: source
      target: 'json_parser'
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: code
        targetType: if-else
      id: json_parser-to-router_if
      source: 'json_parser'
      sourceHandle: source
      target: 'router_if'
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: if-else
        targetType: answer
      id: router_if-to-clarify_answer
      source: 'router_if'
      sourceHandle: 'true'
      target: 'clarify_answer'
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: if-else
        targetType: http-request
      id: router_if-to-1104_agent
      source: 'router_if'
      sourceHandle: 'false-1'
      target: '1104_agent_req'
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: if-else
        targetType: llm
      id: router_if-to-general_agent
      source: 'router_if'
      sourceHandle: 'false'
      target: 'general_agent_llm'
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: ''
        selected: false
        title: 开始
        type: start
        variables:
        - label: sys_query
          max_length: 2000
          options: []
          required: true
          type: paragraph
          variable: sys_query
      height: 90
      id: 'start'
      position:
        x: 50
        y: 300
      positionAbsolute:
        x: 50
        y: 300
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: ''
        model:
          completion_params:
            temperature: 0.1
          mode: chat
          name: ''
          provider: ''
        prompt_template:
        - id: router_sys
          role: system
          text: '你是一个智能网关路由系统。你的职责是分析用户的输入意图，并将其分发给麾下的三位专业专家。
            
            【专家列表】
            1. 1104_assistant：只负责银行 1104 监管报表的填报说明、指标计算规则提取等。
            2. qa_assistant：负责监管相关的法律法规、处罚条例等政策规范类解答。
            3. general_assistant：负责日常聊天、翻译、通用知识。

            【分类与反问规则】
            - 如果用户的问题信息充足，且显然归属于某位专家，请生成 "ROUTE"。
            - 🚨关键：如果用户的问题非常简短且模糊（例如：“那个报表怎么填”、“怎么处理处罚”），你【必须】判断为信息不足，生成 "CLARIFY"，并友善地构思一个反问问题来引导用户提供具体信息（如报表代号、处罚事项特征）。

            【输出格式强制限制】
            要求输出纯 JSON 格式：
            {
              "status": "ROUTE", // "ROUTE" 或 "CLARIFY"
              "target_agent": "1104_assistant", // 如果是 CLARIFY 可为空。
              "clarification_question": "请问您具体要查哪张报表？", // 如果 status 为 CLARIFY，输出反问原话。
              "extracted_params": "" // 提取的重要实体参数。
            }'
        - id: router_user
          role: user
          text: '{{#start.sys_query#}}'
        selected: false
        title: 意图解析专家(LLM)
        type: llm
        variables: []
        vision:
          enabled: false
      height: 98
      id: 'intent_llm'
      position:
        x: 350
        y: 300
      positionAbsolute:
        x: 350
        y: 300
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: ''
        code: |
          import json
          
          def main(arg1: str) -> dict:
              try:
                  cleaned = arg1.replace("```json", "").replace("```", "").strip()
                  data = json.loads(cleaned)
                  return {
                      "status": data.get("status", "ROUTE"),
                      "target_agent": data.get("target_agent", "general_assistant"),
                      "clarification_question": data.get("clarification_question", ""),
                      "extracted_params": data.get("extracted_params", "")
                  }
              except Exception as e:
                  return {
                      "status": "ROUTE",
                      "target_agent": "general_assistant",
                      "clarification_question": "",
                      "extracted_params": ""
                  }
        code_language: python3
        outputs:
          status:
            type: string
          target_agent:
            type: string
          clarification_question:
            type: string
          extracted_params:
            type: string
        selected: false
        title: 解析JSON配置(Code)
        type: code
        variables:
        - variable: arg1
          value_selector:
          - 'intent_llm'
          - text
      height: 54
      id: 'json_parser'
      position:
        x: 650
        y: 300
      positionAbsolute:
        x: 650
        y: 300
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        conditions:
        - comparison_operator: contains
          id: branch_clarify
          logical_operator: and
          variable_selector:
          - 'json_parser'
          - status
          value: 'CLARIFY'
        - comparison_operator: contains
          id: branch_1104
          logical_operator: and
          variable_selector:
          - 'json_parser'
          - target_agent
          value: '1104_assistant'
        desc: ''
        selected: false
        title: 意图分发(IF/ELSE)
        type: if-else
      height: 126
      id: 'router_if'
      position:
        x: 950
        y: 300
      positionAbsolute:
        x: 950
        y: 300
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        answer: '{{#json_parser.clarification_question#}}'
        desc: ''
        selected: false
        title: 反问澄清(Answer)
        type: answer
        variables: []
      height: 103
      id: 'clarify_answer'
      position:
        x: 1250
        y: 100
      positionAbsolute:
        x: 1250
        y: 100
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        authorization:
          config: APP_1104_API_KEY_HERE
          type: bearer
        body:
          data: "{\n  \"inputs\": {\"extracted_params\": \"{{#json_parser.extracted_params#}}\"},\n  \"query\": \"{{#start.sys_query#}}\",\n  \"response_mode\": \"blocking\",\n  \"user\": \"router_user\"\n}\n"
          type: json
        desc: 调用外部 1104 Agent API 或 子工作流
        headers: ''
        method: post
        params: ''
        selected: false
        timeout:
          connect: 10
          read: 60
          write: 20
        title: 调用1104专家(HTTP)
        type: http-request
        url: http://localhost/v1/chat-messages
        variables: []
      height: 105
      id: '1104_agent_req'
      position:
        x: 1250
        y: 300
      positionAbsolute:
        x: 1250
        y: 300
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: ''
        model:
          completion_params:
            temperature: 0.7
          mode: chat
          name: ''
          provider: ''
        prompt_template:
        - id: general_sys
          role: system
          text: 你是一个乐于助人的通用AI助手。
        - id: general_user
          role: user
          text: '{{#start.sys_query#}}'
        selected: false
        title: 通用助手解答(LLM)
        type: llm
        variables: []
        vision:
          enabled: false
      height: 98
      id: 'general_agent_llm'
      position:
        x: 1250
        y: 500
      positionAbsolute:
        x: 1250
        y: 500
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: ''
        outputs:
        - value_selector:
          - 'clarify_answer'
          - answer
          variable: output
        selected: false
        title: 结束
        type: end
        variables: []
      height: 88
      id: '1720000000015'
      position:
        x: 1854
        y: 282
      positionAbsolute:
        x: 1854
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    viewport:
      x: 0
      y: 0
      zoom: 1
  rag_pipeline_variables: []
