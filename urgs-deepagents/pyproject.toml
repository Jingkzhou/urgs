[project]
name = "urgs-deepagents-service"
version = "0.1.0"
description = "Independent DeepAgents microservice component for URGS"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "langchain>=1.3.9,<2.0.0",
  "langchain-anthropic>=1.4.6,<2.0.0",
  "langchain-core>=1.4.7,<2.0.0",
  "langchain-google-genai>=4.2.5,<5.0.0",
  "langchain-openai>=1.2.0,<2.0.0",
  "langsmith>=0.8.11",
  "pydantic==2.11.9",
  "pydantic-settings==2.10.1",
  "python-json-logger==3.3.0",
  "uvicorn[standard]==0.35.0",
  "wcmatch>=10.1",
]

[project.optional-dependencies]
dev = [
  "mypy==1.18.1",
  "pytest==8.4.2",
  "pytest-asyncio==1.1.0",
  "ruff==0.13.0",
]

[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["src/deepagents"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["urgs_deepagents_service"]
exclude = "^src/deepagents/"

[[tool.mypy.overrides]]
module = ["deepagents", "deepagents.*"]
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
