[project]
name = "urgs-mcp-server"
version = "0.1.0"
description = "MCP gateway exposing permission-scoped URGS business capabilities"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "httpx==0.28.1",
  "mcp==2.0.0",
]

[project.optional-dependencies]
dev = [
  "mypy==1.18.1",
  "pytest==8.4.2",
  "pytest-asyncio==1.1.0",
  "ruff==0.13.0",
]

[project.scripts]
urgs-mcp-server = "urgs_mcp_server.main:main"

[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["urgs_mcp_server"]
