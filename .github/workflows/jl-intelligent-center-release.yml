name: 构建吉林银行智能任务中心内网 Windows 更新包
run-name: 智能任务中心更新包 · ${{ inputs.deploy_env }} · ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      deploy_env:
        description: 选择写入客户端的内网更新环境
        required: true
        default: sit
        type: choice
        options:
          - local
          - sit
          - prod
      request_id:
        description: 打包脚本生成的请求标识，用于精确下载本次工件
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-intranet-updater:
    name: 构建签名的 Windows 内网更新包
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      GROK_BUILD_VERSION: "1.0.0"
      GROK_SIDECAR_TARGET: "x86_64-pc-windows-msvc"
      GROK_SIDECAR_LOCK_REQUIRED: "1"
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 配置 pnpm
        shell: pwsh
        run: npm install --global pnpm@11.9.0

      - name: 配置 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 安装 App 依赖
        shell: pwsh
        run: pnpm --dir jl-intelligent-center install --frozen-lockfile

      - name: 准备固定版本的 Grok Build Sidecar
        shell: pwsh
        run: |
          $lock = Get-Content "jl-intelligent-center/grok-sidecar.lock.json" -Raw | ConvertFrom-Json
          $artifact = $lock.targets.PSObject.Properties[$env:GROK_SIDECAR_TARGET].Value
          if ($null -eq $artifact -or $artifact.version -ne $env:GROK_BUILD_VERSION) {
            throw "sidecar 锁定文件未声明目标或版本不匹配"
          }
          $grokSource = Join-Path $env:RUNNER_TEMP "grok.exe"
          Invoke-WebRequest -UseBasicParsing -Uri $artifact.downloadUrl -OutFile $grokSource
          $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $grokSource).Hash.ToLowerInvariant()
          if ($actualHash -ne $artifact.sha256) {
            throw "Grok sidecar SHA-256 校验失败"
          }
          $env:GROK_SIDECAR_SOURCE = $grokSource
          pnpm --dir jl-intelligent-center run prepare:grok -- --target x86_64-pc-windows-msvc

      - name: 设置内网更新地址
        id: updater
        shell: pwsh
        run: |
          if ("${{ inputs.deploy_env }}" -eq "local") {
            $endpoint = "http://127.0.0.1:18080/jl-intelligent-center/latest.json"
          } elseif ("${{ inputs.deploy_env }}" -eq "sit") {
            $endpoint = "http://25.18.17.210:18080/jl-intelligent-center/latest.json"
          } else {
            $endpoint = "http://214.129.29.66:18080/jl-intelligent-center/latest.json"
          }
          "endpoint=$endpoint" >> $env:GITHUB_OUTPUT

      - name: 验证更新签名 Secret
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "缺少 GitHub Secret: TAURI_SIGNING_PRIVATE_KEY"
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            throw "缺少 GitHub Secret: TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          }

      - name: 前端类型检查
        shell: pwsh
        run: pnpm --dir jl-intelligent-center exec tsc --noEmit

      - name: Rust 单元测试
        shell: pwsh
        run: cargo test --manifest-path jl-intelligent-center/src-tauri/Cargo.toml

      - name: 安装包验收器单元测试
        shell: pwsh
        run: pnpm --dir jl-intelligent-center test

      - name: 构建签名的内网更新包
        shell: pwsh
        env:
          DEPLOY_ENV: ${{ inputs.deploy_env }}
          JL_INTELLIGENT_CENTER_UPDATER_ENDPOINT: ${{ steps.updater.outputs.endpoint }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm --dir jl-intelligent-center build:updater

      - name: 验收 Windows 安装包并生成 SHA-256 清单
        shell: pwsh
        run: pnpm --dir jl-intelligent-center verify:windows

      - name: 上传签名的内网更新工件
        uses: actions/upload-artifact@v4
        with:
          name: jl-intelligent-center-updater-${{ inputs.deploy_env }}-${{ inputs.request_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            jl-intelligent-center/src-tauri/target/release/bundle/msi/*.msi
            jl-intelligent-center/src-tauri/target/release/bundle/msi/*.sig
            jl-intelligent-center/src-tauri/target/release/bundle/nsis/*-setup.exe
            jl-intelligent-center/src-tauri/target/release/bundle/nsis/*.sig
            jl-intelligent-center/src-tauri/target/release/bundle/windows-build-manifest.json
            jl-intelligent-center/src-tauri/target/release/bundle/SHA256SUMS.txt
            jl-intelligent-center/src-tauri/binaries/grok-sidecar-manifest.json
