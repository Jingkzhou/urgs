name: 构建 URGS 内网 Windows 更新包
run-name: 内网 Windows 更新包 · ${{ inputs.deploy_env }} · ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      deploy_env:
        description: 选择写入客户端的内网更新环境
        required: true
        default: sit
        type: choice
        options:
          - local
          - sit
          - prod
      request_id:
        description: 打包脚本生成的请求标识，用于精确下载本次工件
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-intranet-updater:
    name: 构建签名的 Windows 内网更新包
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      GROK_BUILD_VERSION: "1.0.0"
      GROK_SIDECAR_TARGET: "x86_64-pc-windows-msvc"
      GROK_SIDECAR_LOCK_REQUIRED: "1"

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 配置 pnpm
        shell: pwsh
        run: npm install --global pnpm@11.9.0

      - name: 配置 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 安装前端依赖
        shell: pwsh
        run: pnpm --dir urgs-web install --frozen-lockfile

      - name: 安装桌面端依赖
        shell: pwsh
        run: pnpm --dir urgs-desktop install --frozen-lockfile

      - name: 准备固定版本的 Grok Build Sidecar
        shell: pwsh
        run: |
          $grokBinDir = Join-Path $env:RUNNER_TEMP "grok-build-bin"
          New-Item -ItemType Directory -Force -Path $grokBinDir | Out-Null
          $lock = Get-Content "urgs-desktop/grok-sidecar.lock.json" -Raw | ConvertFrom-Json
          $artifact = $lock.targets.PSObject.Properties[$env:GROK_SIDECAR_TARGET].Value
          if ($null -eq $artifact) {
            throw "sidecar 锁定文件未声明目标 $env:GROK_SIDECAR_TARGET"
          }
          if ($artifact.version -ne $env:GROK_BUILD_VERSION) {
            throw "sidecar 锁定版本 $($artifact.version) 与流水线版本 $env:GROK_BUILD_VERSION 不一致"
          }
          $grokSource = Join-Path $grokBinDir "grok.exe"
          Invoke-WebRequest -UseBasicParsing -Uri $artifact.downloadUrl -OutFile $grokSource
          $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $grokSource).Hash.ToLowerInvariant()
          if ($actualHash -ne $artifact.sha256) {
            throw "Grok sidecar SHA-256 校验失败：期望 $($artifact.sha256)，实际 $actualHash"
          }
          $env:GROK_SIDECAR_SOURCE = $grokSource
          pnpm --dir urgs-desktop run prepare:grok -- --target x86_64-pc-windows-msvc

      - name: 设置内网更新地址
        id: updater
        shell: pwsh
        run: |
          if ("${{ inputs.deploy_env }}" -eq "local") {
            $endpoint = "http://127.0.0.1:18080/desktop/latest.json"
          } elseif ("${{ inputs.deploy_env }}" -eq "sit") {
            $endpoint = "http://25.18.17.210:18080/desktop/latest.json"
          } else {
            $endpoint = "http://214.129.29.66:18080/desktop/latest.json"
          }
          "endpoint=$endpoint" >> $env:GITHUB_OUTPUT

      - name: 验证更新签名 Secret
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "缺少 GitHub Secret: TAURI_SIGNING_PRIVATE_KEY"
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            throw "缺少 GitHub Secret: TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          }

      - name: 前端类型检查
        shell: pwsh
        run: pnpm --dir urgs-web exec tsc --noEmit

      - name: Rust 单元测试
        shell: pwsh
        run: cargo test --manifest-path urgs-desktop/src-tauri/Cargo.toml

      - name: 安装包验收器单元测试
        shell: pwsh
        run: pnpm --dir urgs-desktop test

      - name: 构建签名的内网更新包
        shell: pwsh
        env:
          TAURI_UPDATER_ENDPOINT: ${{ steps.updater.outputs.endpoint }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm --dir urgs-desktop build:updater

      - name: 验收 Windows 安装包并生成 SHA-256 清单
        shell: pwsh
        run: pnpm --dir urgs-desktop verify:windows

      - name: 安装后验证内置 Grok sidecar
        shell: pwsh
        run: |
          $setup = Get-ChildItem "urgs-desktop/src-tauri/target/release/bundle/nsis/*-setup.exe" | Sort-Object Name | Select-Object -First 1
          if ($null -eq $setup) {
            throw "未找到 NSIS setup.exe，无法执行安装后 Grok 验证"
          }
          & "$PWD/urgs-desktop/scripts/verify-windows-install.ps1" -InstallerPath $setup.FullName -ExpectedVersion $env:GROK_BUILD_VERSION

      - name: 上传签名的内网更新工件
        uses: actions/upload-artifact@v4
        with:
          name: urgs-windows-updater-${{ inputs.deploy_env }}-${{ inputs.request_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            urgs-desktop/src-tauri/target/release/bundle/msi/*.msi
            urgs-desktop/src-tauri/target/release/bundle/msi/*.sig
            urgs-desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            urgs-desktop/src-tauri/target/release/bundle/nsis/*.sig
            urgs-desktop/src-tauri/target/release/bundle/windows-build-manifest.json
            urgs-desktop/src-tauri/target/release/bundle/SHA256SUMS.txt
            urgs-desktop/src-tauri/binaries/grok-sidecar-manifest.json
